<script>
// Carga MSAL y XLSX probando varias fuentes por si alguna está bloqueada en la red.
function cargarScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = url; s.onload = ()=>resolve(url); s.onerror = ()=>reject(url);
    document.head.appendChild(s);
  });
}
window.__cargaLibs = (async () => {
  const msalUrls = [
    "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js",
    "https://unpkg.com/@azure/msal-browser@3/lib/msal-browser.min.js",
    "https://alcdn.msauth.net/browser/3.18.0/js/msal-browser.min.js",
  ];
  const xlsxUrls = [
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
  ];
  window.__msalFalló = true;
  for (const u of msalUrls){ try{ await cargarScript(u); window.__msalFalló = false; break; }catch(e){} }
  window.__xlsxFalló = true;
  for (const u of xlsxUrls){ try{ await cargarScript(u); window.__xlsxFalló = false; break; }catch(e){} }
})();
</script>

<style>
/* ============================================================
   TOKENS DE MARCA — Cementos CAPA
   ============================================================ */
:root{
  --capa-naranja:#F08900;
  --capa-naranja-dark:#c96f00;
  --capa-purpura:#942E86;
  --capa-purpura-dark:#742069;
  --capa-negro:#3E3938;
  --capa-rojo:#CE092C;
  --capa-rosa:#C74D92;

  --bg:#FAFAF8;
  --surface:#FFFFFF;
  --border:#E6E2DA;
  --texto:#3E3938;
  --texto-claro:#8A837C;
  --radio:14px;
  --sombra:0 2px 10px rgba(62,57,56,.07);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--texto);
  font-family:"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
input,button,select,textarea{font-family:inherit;}
button{cursor:pointer;}
h1,h2,h3{margin:0;font-weight:700;}

.gradiente-firma{
  height:6px;width:100%;
  background:linear-gradient(90deg,var(--capa-purpura),var(--capa-rosa),var(--capa-naranja));
  position:fixed;top:0;left:0;z-index:60;
}

/* ---------- pantalla de login ---------- */
#pantalla-login{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;
  gap:22px;
}
#pantalla-login img.logo{width:min(260px,70vw);height:auto;margin-bottom:6px;}
#pantalla-login h1{font-size:1.25rem;color:var(--capa-negro);}
#pantalla-login p{color:var(--texto-claro);font-size:.92rem;max-width:340px;line-height:1.5;margin:0;}
.btn-microsoft{
  display:flex;align-items:center;gap:10px;justify-content:center;
  background:var(--capa-negro);color:#fff;border:none;border-radius:10px;
  padding:14px 22px;font-size:1rem;font-weight:600;width:100%;max-width:320px;
}
.btn-microsoft svg{flex-shrink:0;}
.btn-microsoft:active{opacity:.85;}

/* ---------- layout app ---------- */
#app{display:none;min-height:100vh;flex-direction:column;padding-bottom:calc(70px + var(--safe-bottom));}
header.cabecera{
  position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px 10px;
}
.fila-cabecera{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fila-cabecera img.logo-mini{height:22px;width:auto;}
.usuario-chip{
  display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--texto-claro);
}
.usuario-chip button{
  background:none;border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:.72rem;color:var(--texto-claro);
  display:inline-flex;align-items:center;gap:4px;
}

.selectores{display:flex;gap:8px;margin-top:12px;}
.selector-campo{flex:1;min-width:0;}
.selector-campo label{
  display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--texto-claro);margin-bottom:4px;font-weight:600;
}
.selector-campo select{
  width:100%;padding:10px 10px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--texto);font-size:.88rem;font-weight:600;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238A837C'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;
}

.estado-conexion{
  margin-top:10px;font-size:.72rem;color:var(--texto-claro);
  display:flex;align-items:center;gap:6px;
}
.punto{width:7px;height:7px;border-radius:50%;background:var(--capa-naranja);flex-shrink:0;}
.punto.ok{background:#4a9d5a;}
.punto.error{background:var(--capa-rojo);}

main{flex:1;padding:16px;padding-bottom:32px;}

/* ---------- tarjetas / listas ---------- */
.tarjeta{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radio);
  padding:16px;margin-bottom:12px;box-shadow:var(--sombra);
}
.aviso{
  background:#FFF3E0;border:1px solid #FCD9A0;color:#8a5a00;
  border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:14px;line-height:1.45;
}
.aviso.error{background:#FDECEC;border-color:#F5B7B7;color:var(--capa-rojo);}
.aviso.info{background:#F3EAF1;border-color:#E3C9DF;color:var(--capa-purpura-dark);}

.campo-busqueda{position:relative;margin-bottom:14px;}
.campo-busqueda input{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
  font-size:1rem;background:var(--surface);
}
.campo-busqueda input:focus{outline:none;border-color:var(--capa-naranja);}

.lista-articulos{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.item-articulo{
  text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;width:100%;
}
.item-articulo:active{border-color:var(--capa-naranja);}
.item-articulo .cod{font-size:.72rem;color:var(--capa-purpura);font-weight:700;letter-spacing:.02em;}
.item-articulo .desc{font-size:.92rem;font-weight:600;margin-top:2px;color:var(--texto);}

/* ---------- formulario de registro ---------- */
.articulo-elegido{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border);
}
.articulo-elegido .cod{font-size:.75rem;color:var(--capa-purpura);font-weight:700;}
.articulo-elegido .desc{font-size:1.05rem;font-weight:700;margin-top:2px;}
.btn-cambiar{background:none;border:none;color:var(--texto-claro);font-size:.8rem;text-decoration:underline;padding:4px;}

.fila-unidad{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px dashed var(--border);
}
.fila-unidad:last-of-type{border-bottom:none;}
.fila-unidad .info-unidad{flex:1;min-width:0;}
.fila-unidad .nombre-unidad{font-weight:700;font-size:.95rem;}
.fila-unidad .factor-unidad{font-size:.72rem;color:var(--texto-claro);}
.fila-unidad input{
  width:104px;padding:10px;border-radius:10px;border:1.5px solid var(--border);
  font-size:1.05rem;text-align:right;
}
.fila-unidad input:focus{outline:none;border-color:var(--capa-naranja);}

.stepper-cantidad{display:flex;align-items:center;gap:6px;}
.stepper-cantidad input{width:78px;}
.btn-stepper{
  width:36px;height:36px;flex-shrink:0;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--capa-negro);font-size:1.2rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.btn-stepper:active{background:var(--capa-naranja);color:#fff;border-color:var(--capa-naranja);}

.fila-extra{display:flex;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border);}
.campo-extra{flex:1;min-width:0;}
.campo-extra label{
  display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--texto-claro);margin-bottom:4px;font-weight:600;
}
.campo-extra select,.campo-extra input{
  width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);
  font-size:.88rem;background:var(--surface);color:var(--texto);
}

.resumen-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:14px;border-top:2px solid var(--capa-negro);
}
.resumen-total .etiqueta{font-size:.8rem;color:var(--texto-claro);font-weight:600;}
.resumen-total .valor{font-size:1.4rem;font-weight:800;color:var(--capa-negro);}

.btn-primario,.btn-secundario,.btn-texto,.btn-cambiar,.btn-borrar,.crear-inline button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primario svg,.btn-secundario svg,.btn-texto svg,.btn-cambiar svg,.btn-borrar svg,.crear-inline button svg{
  width:15px;height:15px;flex-shrink:0;
}
.btn-primario{
  width:100%;padding:15px;border:none;border-radius:12px;
  background:var(--capa-naranja);color:#fff;font-size:1rem;font-weight:700;
  margin-top:16px;
}
.btn-primario:disabled{background:#E6DFD3;color:#B3ACA2;}
.btn-primario:active:not(:disabled){background:var(--capa-naranja-dark);}

.btn-secundario{
  width:100%;padding:13px;border-radius:12px;background:var(--surface);
  border:1.5px solid var(--capa-purpura);color:var(--capa-purpura);font-weight:700;font-size:.92rem;
}
.btn-texto{background:none;border:none;color:var(--capa-purpura);font-weight:600;font-size:.85rem;padding:8px;}
.btn-texto svg{width:13px;height:13px;}

/* ---------- vista inventario ---------- */
.resumen-cabecera{display:flex;gap:10px;margin-bottom:14px;}

.tabs-subvista{display:flex;gap:6px;margin-bottom:14px;background:var(--bg);border-radius:12px;padding:4px;}
.tab-sub{flex:1;padding:9px 6px;border:none;border-radius:9px;background:none;font-size:.82rem;font-weight:700;color:var(--texto-claro);display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.tab-sub svg{width:14px;height:14px;}
.tab-sub.activa{background:var(--surface);color:var(--capa-purpura);box-shadow:var(--sombra);}

.tabla-diferencias th.grupo{text-align:center;border-bottom:1px solid var(--border);}
.tabla-diferencias th,.tabla-diferencias td{white-space:nowrap;}
.tabla-diferencias td.dif-sobra{color:#2f7a3d;font-weight:700;}
.tabla-diferencias td.dif-falta{color:var(--capa-rojo);font-weight:700;}
.chip-metrica{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;
}
.chip-metrica .num{font-size:1.3rem;font-weight:800;color:var(--capa-purpura);}
.chip-metrica .lbl{font-size:.66rem;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

table.tabla-inventario{width:100%;border-collapse:collapse;font-size:.85rem;}
table.tabla-inventario th{
  text-align:left;font-size:.68rem;text-transform:uppercase;color:var(--texto-claro);
  padding:6px 8px;border-bottom:2px solid var(--border);letter-spacing:.03em;
}
table.tabla-inventario td{padding:10px 8px;border-bottom:1px solid var(--border);}
table.tabla-inventario td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
table.tabla-inventario tr:active{background:#FAF6F0;}
table.tabla-inventario tbody tr{cursor:pointer;}

.fila-detalle-registro{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px dashed var(--border);font-size:.83rem;
}
.fila-detalle-registro .meta{color:var(--texto-claro);font-size:.72rem;}
.btn-borrar{background:none;border:none;color:var(--capa-rojo);font-size:.72rem;font-weight:700;padding:4px 6px;flex-shrink:0;}
.btn-borrar svg{width:13px;height:13px;}

/* ---------- navegación inferior ---------- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
}
nav.tabs button{
  flex:1;background:none;border:none;padding:11px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--texto-claro);font-size:.72rem;font-weight:600;
}
nav.tabs button.activa{color:var(--capa-naranja);}
nav.tabs svg{width:22px;height:22px;}

.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--capa-naranja);
  animation:girar .7s linear infinite;margin:20px auto;
}
@keyframes girar{to{transform:rotate(360deg);}}
.centro{text-align:center;color:var(--texto-claro);font-size:.85rem;padding:20px 0;}

.crear-inline{display:flex;gap:8px;margin-top:8px;}
.crear-inline-col{flex-direction:column;align-items:stretch;}
.crear-inline-fila{display:flex;flex-direction:column;gap:3px;}
.etiqueta-mini{font-size:.68rem;color:var(--texto-claro);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.fila-anio-mes{display:flex;gap:8px;}
.select-mes{
  width:100%;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);
  font-size:.9rem;font-weight:700;color:var(--capa-negro);background:var(--surface);
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238A837C'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:14px;
}
.select-mes:focus{outline:none;border-color:var(--capa-naranja);}
.crear-inline input{
  flex:1;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);font-size:.85rem;
}
.crear-inline button{
  background:var(--capa-purpura);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:700;font-size:.85rem;
}
</style>
</head>

function parseNum(s){

  const n = parseFloat(String(s).replace(",", "."));
  return isNaN(n) ? 0 : n;
}

// Convierte un total en toneladas a la unidad base propia del artículo (Sacos, Unidades, Toneladas…)
function aUnidadBase(totalToneladas, articulo){
  const objetivo = (articulo?.unidadSistema || "").trim();
  const base = articulo?.unidades?.[0];

  if (objetivo){
    // ¿La columna "unidad" pide directamente toneladas/peso?
    if (/^t(on|n)\b|tonelad/i.test(objetivo)){
      return { cantidad: totalToneladas, nombre: objetivo };
    }
    // ¿Coincide con alguna de las unidades propias del artículo (Sacos, Cajas, Pallet…)?
    const coincide = articulo.unidades?.find(u =>
      u.nombre.toLowerCase() === objetivo.toLowerCase()
      || u.nombre.toLowerCase().includes(objetivo.toLowerCase())
      || objetivo.toLowerCase().includes(u.nombre.toLowerCase())
    );
    if (coincide && coincide.factor){
      return { cantidad: totalToneladas / coincide.factor, nombre: objetivo };
    }
  }

  // Sin columna "unidad" aprovechable: usamos la unidad base tradicional (Descrip_Unidad/Conv_unidad)
  if (!base || !base.factor){
    return { cantidad: totalToneladas, nombre: objetivo || "Cantidad" };
  }
  return { cantidad: totalToneladas / base.factor, nombre: objetivo || base.nombre };
}

// Agrupa los registros de un inventario por artículo Y por ubicación (00/10/20),
// convirtiendo cada ubicación a la unidad propia del artículo. Necesario para
// comparar contra el Excel de stock de sistema, que viene con esas 3 columnas.
function agregarPorArticuloYUbicacion(registros){
  const mapaTon = new Map();
  for (const r of registros){
    const cur = mapaTon.get(r.codigo) || { codigo:r.codigo, descripcion:r.descripcion, ton:{"00":0,"10":0,"20":0} };
    const ubic = ["00","10","20"].includes(r.ubicacion) ? r.ubicacion : "00";
    cur.ton[ubic] += r.totalToneladas || 0;
    mapaTon.set(r.codigo, cur);
  }
  const resultado = new Map();
  for (const [codigo, cur] of mapaTon){
    const articulo = state.articulosPorCodigo?.get(codigo);
    const c00 = aUnidadBase(cur.ton["00"], articulo);
    const c10 = aUnidadBase(cur.ton["10"], articulo);
    const c20 = aUnidadBase(cur.ton["20"], articulo);
    resultado.set(codigo, {
      codigo, descripcion: cur.descripcion, unidad: c00.nombre,
      c00: c00.cantidad, c10: c10.cantidad, c20: c20.cantidad,
      total: c00.cantidad + c10.cantidad + c20.cantidad,
    });
  }
  return resultado;
}

async function initMsal(){
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: `https://login.microsoftonline.com/${CONFIG.TENANT_ID}`,
      redirectUri: window.location.href.split("#")[0].split("?")[0],
    },
    cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false },
  });
  await msalInstance.initialize();
  // Si venimos de vuelta de un login por redirección, esto recoge la respuesta.
  const respuesta = await msalInstance.handleRedirectPromise().catch(e=>{
    console.error(e);
    avisoLogin("No se pudo completar el inicio de sesión (" + (e.errorCode||e.message) + ").");
    return null;
  });
  if (respuesta && respuesta.account){
    msalInstance.setActiveAccount(respuesta.account);
    return respuesta.account;
  }
  return null;
}

async function login(){
  avisoLogin("");
  if (window.__msalFalló || typeof msal === "undefined" || !msalInstance){
    avisoLogin("La librería de inicio de sesión no está disponible (revisa tu conexión, o si un bloqueador de anuncios impide cargar alcdn.msauth.net). Recarga la página e inténtalo de nuevo.");
    return;
  }
  if (CONFIG.CLIENT_ID.startsWith("PON_AQUI")){
    avisoLogin("Esta app todavía no está configurada: falta el CLIENT_ID / TENANT_ID en el archivo. Revisa la sección CONFIG al principio del código.");
    return;
  }
  try{
    // Usamos redirección en vez de ventana emergente: es lo fiable en Safari/iOS,
    // donde las cookies de terceros rompen la comunicación con el popup.
    await msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
    // A partir de aquí el navegador sale de la página; el resultado se recoge
    // en initMsal() -> handleRedirectPromise() al volver.
  }catch(e){
    console.error(e);
    avisoLogin("No se pudo iniciar sesión (" + (e.errorCode||e.message) + ").");
  }
}

async function logout(){
  await msalInstance.logoutRedirect().catch(()=>{ window.location.reload(); });
}

async function getToken(){
  const account = msalInstance.getActiveAccount();
  if (!account) throw new Error("Sesión no iniciada");
  try{
    const res = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return res.accessToken;
  }catch(e){
    await msalInstance.acquireTokenRedirect({ scopes: GRAPH_SCOPES });
    // Igual que en login: el navegador redirige y vuelve, no hay valor que devolver aquí.
    throw new Error("Redirigiendo para renovar el permiso de acceso…");
  }
}

async function graphFetch(path, options={}){
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    ...options,
    headers: { "Authorization": `Bearer ${token}`, ...(options.headers||{}) },
  });
  if (!res.ok){
    const texto = await res.text().catch(()=> "");
    const err = new Error(`Graph ${res.status}: ${texto}`);
    err.status = res.status;
    throw err;
  }
  return res;
}

async function resolveSiteAndDrive(){
  const url = new URL(CONFIG.SITE_URL);
  const siteRes = await graphFetch(`/sites/${url.hostname}:${url.pathname}`);
  const site = await siteRes.json();
  state.siteId = site.id;

  const drivesRes = await graphFetch(`/sites/${state.siteId}/drives`);
  const drives = (await drivesRes.json()).value;
  const drive = drives.find(d => d.name === CONFIG.LIBRARY_NAME) || drives[0];
  if (!drive) throw new Error("No se encontró ninguna biblioteca de documentos en el sitio.");
  state.driveId = drive.id;
}

async function existeCarpeta(path){
  try{
    await graphFetch(`/drives/${state.driveId}/root:/${encPath(path)}`);
    return true;
  }catch(e){
    if (e.status === 404) return false;
    throw e;
  }
}

async function ensureFolder(path){
  const partes = path.split("/").filter(Boolean);
  let actual = "";
  for (const parte of partes){
    const padre = actual;
    actual = actual ? `${actual}/${parte}` : parte;
    const ya = await existeCarpeta(actual);
    if (!ya){
      const destino = padre
        ? `/drives/${state.driveId}/root:/${encPath(padre)}:/children`
        : `/drives/${state.driveId}/root/children`;
      await graphFetch(destino, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ name: parte, folder:{}, "@microsoft.graph.conflictBehavior":"replace" }),
      }).catch(e=>{ if (e.status !== 409) throw e; });
    }
  }
}

async function listChildFolders(path){
  try{
    const destino = path && path.trim()
      ? `/drives/${state.driveId}/root:/${encPath(path)}:/children?$top=200`
      : `/drives/${state.driveId}/root/children?$top=200`;
    const res = await graphFetch(destino);
    const data = await res.json();
    return data.value.filter(i=>i.folder).map(i=>i.name).sort((a,b)=>b.localeCompare(a));
  }catch(e){
    if (e.status === 404) return [];
    throw e;
  }
}

/* ---------- maestro de artículos ---------- */
function buscarColumna(fila, nombre){
  const claves = Object.keys(fila);
  let k = claves.find(k => k.trim() === nombre);
  if (k) return k;
  k = claves.find(k => k.includes(`[${nombre}]`));
  if (k) return k;
  k = claves.find(k => k.toLowerCase().replace(/\s/g,"").includes(nombre.toLowerCase()));
  return k;
}

function normalizarArticulo(fila){
  const get = (nombre) => { const k = buscarColumna(fila, nombre); return k ? fila[k] : ""; };
  const codigo = String(get(COLS.codigo) ?? "").trim();
  const descripcion = String(get(COLS.descripcion) ?? "").trim();
  const unidades = [];
  const pares = [
    [COLS.unidadBase, COLS.convBase],
    [COLS.unidadEnv1, COLS.convEnv1],
    [COLS.unidadEnv2, COLS.convEnv2],
  ];
  for (const [nombreCol, factorCol] of pares){
    const nombre = String(get(nombreCol) ?? "").trim();
    const factor = parseNum(get(factorCol));
    if (nombre) unidades.push({ nombre, factor });
  }
  const unidadSistema = String(get(COLS.unidadSistema) ?? "").trim();
  return { codigo, descripcion, unidades, unidadSistema };
}

async function loadMaster(){
  const res = await graphFetch(`/drives/${state.driveId}/root:/${encPath(CONFIG.MASTER_FILE_PATH)}:/content`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type:"array" });
  const hoja = CONFIG.MASTER_SHEET_NAME || wb.SheetNames[0];
  const ws = wb.Sheets[hoja];
  if (!ws) throw new Error(`No se encontró la hoja "${hoja}" en el Excel maestro.`);
  const filas = XLSX.utils.sheet_to_json(ws, { defval:"" });
  state.articulos = filas.map(normalizarArticulo).filter(a => a.codigo);
  state.articulosPorCodigo = new Map(state.articulos.map(a => [a.codigo, a]));
}

/* ---------- stock de sistema (comparación de diferencias) ---------- */
function normalizarTexto(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function buscarColumnaLibre(fila, ...posibles){
  const claves = Object.keys(fila);
  for (const nombre of posibles){
    const norm = normalizarTexto(nombre);
    const k = claves.find(k => normalizarTexto(k) === norm);
    if (k) return k;
  }
  for (const nombre of posibles){
    const norm = normalizarTexto(nombre);
    const k = claves.find(k => normalizarTexto(k).includes(norm) || norm.includes(normalizarTexto(k)));
    if (k) return k;
  }
  return null;
}

const NOMBRE_ARCHIVO_STOCK_SISTEMA = "_stock_sistema.xlsx";

async function subirStockSistema(file){
  const buf = await file.arrayBuffer();
  const carpeta = carpetaInventario();
  await ensureFolder(carpeta);
  await graphFetch(`/drives/${state.driveId}/root:/${encPath(carpeta)}/${NOMBRE_ARCHIVO_STOCK_SISTEMA}:/content`, {
    method:"PUT",
    headers:{"Content-Type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"},
    body: buf,
  });
  state.stockSistemaCacheKey = ""; // invalida caché
}

async function cargarStockSistema(){
  const clave = carpetaInventario();
  if (state.stockSistemaCacheKey === clave) return state.stockSistema;

  try{
    const res = await graphFetch(`/drives/${state.driveId}/root:/${encPath(clave)}/${NOMBRE_ARCHIVO_STOCK_SISTEMA}:/content`);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    // Leemos por posición de columna, no por nombre de encabezado (el encabezado
    // solo se usa para saltar la primera fila): 1ª código, 2ª descripción,
    // 3ª/4ª/5ª cantidad en ubicación 00/10/20.
    const filas = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", range:1 });

    const mapa = new Map();
    for (const fila of filas){
      const codigo = String(fila[0] ?? "").trim();
      if (!codigo) continue;
      const c00 = parseNum(fila[2]);
      const c10 = parseNum(fila[3]);
      const c20 = parseNum(fila[4]);
      mapa.set(codigo, {
        codigo,
        descripcion: String(fila[1] ?? "").trim(),
        c00, c10, c20, total: c00+c10+c20,
      });
    }
    state.stockSistema = mapa;
    state.stockSistemaCacheKey = clave;
    return mapa;
  }catch(e){
    if (e.status === 404){
      state.stockSistema = null;
      state.stockSistemaCacheKey = clave;
      return null;
    }
    throw e;
  }
}

async function cargarRegistros(){
  const clave = carpetaInventario();
  if (state.registrosCacheKey === clave) return state.registrosCache;

  const carpeta = `${clave}/registros`;
  let items = [];
  try{

    items = (await res.json()).value.filter(i=>i.file);
  }catch(e){

  const registros = [];
  for (const item of items){
    try{
      const c = await graphFetch(`/drives/${state.driveId}/items/${item.id}/content`);
      const datos = await c.json();
      registros.push({ ...datos, _fileId: item.id, _fileName: item.name });
    }catch(e){ /* si un archivo falla, se ignora y se sigue con el resto */ }
  }
  registros.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  state.registrosCache = registros;
  state.registrosCacheKey = clave;
  return registros;
}

async function borrarRegistro(fileId){
  await graphFetch(`/drives/${state.driveId}/items/${fileId}`, { method:"DELETE" });
  state.registrosCacheKey = "";
}

/* ============================================================
   ARRANQUE DE LA APP
   ============================================================ */
async function arrancarApp(account){
  state.account = account;
  $("#pantalla-login").style.display = "none";
  $("#app").style.display = "flex";
  $("#nombre-usuario").textContent = account.name || account.username;
  setEstado("Conectando con SharePoint…");

  try{
    await resolveSiteAndDrive();
    setEstado("Cargando maestro de artículos…");
    await loadMaster();
    setEstado(`Conectado · ${state.articulos.length} artículos cargados`, "ok");
    await cargarAlmacenes();
  }catch(e){
    console.error(e);
    setEstado("Error de conexión — revisa la CONFIG (ver detalle abajo)", "error");
    $("#contenido").innerHTML = `<div class="aviso error">No se ha podido conectar con SharePoint.<br><br><b>Detalle:</b> ${e.message}<br><br>Revisa en la CONFIG del archivo: SITE_URL, LIBRARY_NAME, ROOT_FOLDER y MASTER_FILE_PATH, y que la cuenta tenga acceso a ese sitio.</div>`;
  }
}

async function cargarAlmacenes(){
  state.almacenes = await listChildFolders(CONFIG.ROOT_FOLDER);
  const sel = $("#sel-almacen");
  sel.innerHTML = state.almacenes.map(a=>`<option value="${a}">${a}</option>`).join("")
    + `<option value="__nuevo__">+ Nuevo almacén…</option>`;
  if (state.almacenes.length){
    state.almacenActual = state.almacenes[0];
    sel.value = state.almacenActual;
    $("#panel-nuevo-almacen").style.display = "none";
    await cargarInventarios();
  } else {
    // No hay ningún almacén todavía: mostramos directamente el formulario de creación,
    // porque el <select> no dispara "change" cuando solo tiene esta única opción.
    state.almacenActual = "";
    sel.value = "__nuevo__";
    $("#panel-nuevo-almacen").style.display = "flex";
    $("#sel-inventario").innerHTML = "";
    $("#panel-nuevo-inventario").style.display = "none";
    renderVista();
  }
}

async function cargarInventarios(){
  if (!state.almacenActual){ $("#sel-inventario").innerHTML = ""; return renderVista(); }
  state.inventarios = await listChildFolders(`${CONFIG.ROOT_FOLDER}/${state.almacenActual}`);
  state.inventariosInfo = {};
  for (const nombre of state.inventarios){
    const carpeta = `${CONFIG.ROOT_FOLDER}/${state.almacenActual}/${nombre}`;
    state.inventariosInfo[nombre] = await leerInfoInventario(carpeta);
  }
  const sel = $("#sel-inventario");
  sel.innerHTML = state.inventarios.map(i=>{
    const info = state.inventariosInfo[i];
    const etiqueta = info?.fecha ? `${i} — ${fmtFecha(info.fecha)}` : i;
    return `<option value="${i}">${etiqueta}</option>`;
  }).join("") + `<option value="__nuevo__">+ Nuevo inventario…</option>`;
  if (state.inventarios.length){
    state.inventarioActual = state.inventarios[0];
    sel.value = state.inventarioActual;
    $("#panel-nuevo-inventario").style.display = "none";
  } else {
    // Igual que con almacenes: sin inventarios previos, mostramos el formulario directamente.
    state.inventarioActual = "";
    sel.value = "__nuevo__";
    $("#input-fecha-inventario").value = fechaHoraLocalInput();
    $("#panel-nuevo-inventario").style.display = "flex";
  }
  renderVista();
}

/* ============================================================
   RENDER — VISTA "REGISTRAR MERCANCÍA"
   ============================================================ */
function renderRegistrar(){
  const cont = $("#contenido");

  if (!state.almacenActual){
    cont.innerHTML = `
      <div class="aviso info">Todavía no hay ningún almacén creado.</div>
      <button class="btn-primario" id="btn-cta-crear-almacen">${ICONOS.mas}Crear almacén</button>`;
    $("#btn-cta-crear-almacen").addEventListener("click", abrirCreadorAlmacen);
    return;
  }
  if (!state.inventarioActual){
    cont.innerHTML = `
      <div class="aviso info">Elige o crea un inventario (recuento) para "${state.almacenActual}".</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${state.inventarios.length ? `<button class="btn-secundario" id="btn-cta-abrir-inventario">${ICONOS.carpeta}Abrir inventario existente</button>` : ''}
        <button class="btn-primario" id="btn-cta-crear-inventario">${ICONOS.mas}Nuevo inventario</button>
      </div>`;
    $("#btn-cta-abrir-inventario")?.addEventListener("click", abrirSelectorInventario);
    $("#btn-cta-crear-inventario").addEventListener("click", abrirCreadorInventario);
    return;
  }

  if (!state.articuloSeleccionado){
    cont.innerHTML = `
      <div class="tarjeta">
        <div class="campo-busqueda">
          <input id="input-buscar-articulo" placeholder="Código o descripción del artículo…" autocomplete="off">
        </div>
        <div class="lista-articulos" id="lista-articulos">
          <div class="centro">Escribe para buscar un artículo</div>
        </div>
      </div>`;
    const input = $("#input-buscar-articulo");
    input.addEventListener("input", () => renderListaArticulos(input.value));
    input.focus();
    return;
  }

  const art = state.articuloSeleccionado;
  cont.innerHTML = `
    <div class="tarjeta">
      <div class="articulo-elegido">
        <div>
          <div class="cod">${art.codigo}</div>
          <div class="desc">${art.descripcion}</div>
        </div>
        <button class="btn-cambiar" id="btn-cambiar-articulo">${ICONOS.cambiar}Cambiar</button>
      </div>

      <div class="aviso info" id="aviso-editando" style="display:none;align-items:center;justify-content:space-between;gap:10px;">
        <span>Editando un registro existente</span>
        <button class="btn-texto" id="btn-cancelar-edicion" style="padding:2px;">${ICONOS.cerrar}Cancelar edición</button>
      </div>

      <div class="fila-extra">
        <div class="campo-extra">
          <label for="sel-ubicacion">Ubicación</label>
          <select id="sel-ubicacion">
            <option value="00">00</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="campo-extra">
          <label for="input-caducidad">Fecha de caducidad (opcional)</label>
          <input type="date" id="input-caducidad">
        </div>
      </div>

      <div id="filas-unidades">
        ${art.unidades.map((u,i)=>`
          <div class="fila-unidad">
            <div class="info-unidad">
              <div class="nombre-unidad">${u.nombre}</div>
              <div class="factor-unidad">= ${u.factor.toLocaleString("es-ES",{maximumFractionDigits:4})} Ton/unidad</div>
            </div>
            <div class="stepper-cantidad">
              <button type="button" class="btn-stepper" data-accion="menos" data-idx="${i}" aria-label="Restar">−</button>
              <input type="text" inputmode="decimal" placeholder="0" data-factor="${u.factor}" data-nombre="${u.nombre}" id="cantidad-${i}">
              <button type="button" class="btn-stepper" data-accion="mas" data-idx="${i}" aria-label="Sumar">+</button>
            </div>
          </div>`).join("")}
      </div>

      <div class="resumen-total">
        <span class="etiqueta">Total registro</span>
        <span class="valor" id="total-toneladas">0 ${art.unidadSistema || art.unidades[0]?.nombre || "Cantidad"}</span>
      </div>

      <button class="btn-primario" id="btn-guardar-registro" disabled>${ICONOS.guardar}Guardar registro</button>
    </div>

    <div class="tarjeta" id="tarjeta-recientes">
      <h3 style="font-size:.85rem;color:var(--texto-claro);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;">Registros recientes de este artículo</h3>
      <div id="lista-recientes"><div class="centro">Cargando…</div></div>
    </div>
  `;

  state.editandoId = null;

  $("#btn-cambiar-articulo").addEventListener("click", ()=>{
    state.articuloSeleccionado = null;
    state.editandoId = null;
    renderVista();
  });

  const inputs = art.unidades.map((_,i)=> $(`#cantidad-${i}`));
  const actualizarTotal = () => {
    let total = 0;
    inputs.forEach(inp => { total += parseNum(inp.value) * parseFloat(inp.dataset.factor); });
    const { cantidad, nombre } = aUnidadBase(total, art);
    $("#total-toneladas").textContent = fmtCantidad(cantidad) + " " + nombre;
    $("#btn-guardar-registro").disabled = total <= 0;
  };
  inputs.forEach(inp => inp.addEventListener("input", actualizarTotal));

  document.querySelectorAll(".btn-stepper").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const inp = inputs[Number(btn.dataset.idx)];
      const actual = parseNum(inp.value);
      const nuevo = btn.dataset.accion === "mas" ? actual + 1 : Math.max(0, actual - 1);
      inp.value = nuevo === 0 ? "" : String(nuevo).replace(".", ",");
      actualizarTotal();
    });
  });

  function salirModoEdicion(){
    state.editandoId = null;
    $("#aviso-editando").style.display = "none";
    inputs.forEach(inp => inp.value = "");
    $("#input-caducidad").value = "";
    $("#sel-ubicacion").value = "00";
    actualizarTotal();
    $("#btn-guardar-registro").innerHTML = ICONOS.guardar + "Guardar registro";
  }
  $("#btn-cancelar-edicion").addEventListener("click", salirModoEdicion);

  function entrarModoEdicion(r){
    state.editandoId = r._fileId;
    art.unidades.forEach((u,i)=>{
      const det = r.detalle.find(d => d.unidad === u.nombre);
      inputs[i].value = det ? String(det.cantidad).replace(".", ",") : "";
    });
    $("#sel-ubicacion").value = r.ubicacion || "00";
    $("#input-caducidad").value = r.fechaCaducidad || "";
    actualizarTotal();
    $("#aviso-editando").style.display = "flex";
    $("#btn-guardar-registro").innerHTML = ICONOS.guardar + "Guardar cambios";
    $("#btn-guardar-registro").scrollIntoView({behavior:"smooth", block:"center"});
  }

  $("#btn-guardar-registro").addEventListener("click", async () => {
    const detalle = [];
    let total = 0;
    inputs.forEach(inp => {
      const cantidad = parseNum(inp.value);
      if (cantidad > 0){
        const factor = parseFloat(inp.dataset.factor);
        const subtotal = cantidad * factor;
        total += subtotal;
        detalle.push({ unidad: inp.dataset.nombre, cantidad, factor, subtotal });
      }
    });
    if (!detalle.length) return;

    const { cantidad: totalUnidadBase, nombre: unidadBase } = aUnidadBase(total, art);
    const ubicacion = $("#sel-ubicacion").value;
    const fechaCaducidad = $("#input-caducidad").value || null;
    const editando = !!state.editandoId;

    const btn = $("#btn-guardar-registro");
    btn.disabled = true; btn.textContent = editando ? "Guardando cambios…" : "Guardando…";
    try{
      const registro = {
        fecha: editando ? (await cargarRegistros()).find(r=>r._fileId===state.editandoId)?.fecha || new Date().toISOString() : new Date().toISOString(),
        usuario: state.account.name || state.account.username,
        usuarioEmail: state.account.username,
        almacen: state.almacenActual,
        inventario: state.inventarioActual,
        codigo: art.codigo,
        descripcion: art.descripcion,
        ubicacion,
        fechaCaducidad,
        detalle,
        totalToneladas: total,
        unidadBase,
        totalUnidadBase,
      };
      if (editando){
        registro.editadoEn = new Date().toISOString();
        await actualizarRegistro(state.editandoId, registro);
      } else {
        await guardarRegistro(registro);
      }
      salirModoEdicion();
      await renderRecientes(art.codigo, entrarModoEdicion);
      btn.textContent = "✓ Guardado";
      setTimeout(()=>{ btn.innerHTML = ICONOS.guardar + "Guardar registro"; btn.disabled = true; }, 900);
    }catch(e){
      console.error(e);
      alert("No se pudo guardar el registro: " + e.message);
      btn.disabled = false; btn.innerHTML = ICONOS.guardar + (editando ? "Guardar cambios" : "Guardar registro");
    }
  });

  renderRecientes(art.codigo, entrarModoEdicion);
}

async function renderRecientes(codigo, onEditar){
  const cont = $("#lista-recientes");
  if (!cont) return;
  try{
    const registros = (await cargarRegistros()).filter(r=>r.codigo === codigo).slice(0,8);
    if (!registros.length){
      cont.innerHTML = `<div class="centro">Sin registros todavía para este artículo</div>`;
      return;
    }
    cont.innerHTML = registros.map(r=>`
      <div class="fila-detalle-registro">
        <div>
          <div>${r.totalUnidadBase!=null ? fmtCantidad(r.totalUnidadBase)+" "+r.unidadBase : fmtTon(r.totalToneladas)+" Ton"}${r.ubicacion ? ` · Ubic. ${r.ubicacion}` : ""}</div>
          <div class="meta">${fmtFecha(r.fecha)} · ${r.usuario||""}${r.fechaCaducidad ? " · Caduca " + r.fechaCaducidad : ""}${r.editadoEn ? " · editado" : ""}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button class="btn-texto" style="padding:4px 6px;font-size:.72rem;" data-editar-id="${r._fileId}">${ICONOS.lapiz}Editar</button>
          <button class="btn-borrar" data-id="${r._fileId}">${ICONOS.papelera}Anular</button>
        </div>
      </div>`).join("");
    if (onEditar){
      cont.querySelectorAll("[data-editar-id]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const r = registros.find(x=>x._fileId === b.dataset.editarId);
          if (r) onEditar(r);
        });
      });
    }
    cont.querySelectorAll(".btn-borrar").forEach(b=>{
      b.addEventListener("click", async ()=>{
        if (!confirm("¿Anular este registro? No se puede deshacer.")) return;
        await borrarRegistro(b.dataset.id);
        await renderRecientes(codigo, onEditar);
      });
    });
  }catch(e){
    cont.innerHTML = `<div class="aviso error">No se pudieron cargar los registros recientes.</div>`;
  }
}

function renderListaArticulos(q){
  const cont = $("#lista-articulos");
  q = q.trim().toLowerCase();
  if (!q){ cont.innerHTML = `<div class="centro">Escribe para buscar un artículo</div>`; return; }
  const resultados = state.articulos.filter(a =>
    a.codigo.toLowerCase().includes(q) || a.descripcion.toLowerCase().includes(q)
  ).slice(0, 30);
  if (!resultados.length){
    cont.innerHTML = `<div class="centro">Sin resultados para "${q}"</div>`;
    return;
  }
  cont.innerHTML = resultados.map((a,i)=>`
    <button class="item-articulo" data-idx="${i}">
      <div class="cod">${a.codigo}</div>
      <div class="desc">${a.descripcion}</div>
    </button>`).join("");
  cont.querySelectorAll(".item-articulo").forEach((btn,i)=>{
    btn.addEventListener("click", ()=>{
      state.articuloSeleccionado = resultados[i];
      renderVista();
    });
  });
}

   RENDER — VISTA "INVENTARIO"
   ============================================================ */
async function renderInventario(){
  const cont = $("#contenido");

  if (!state.almacenActual){
    cont.innerHTML = `
      <div class="aviso info">Todavía no hay ningún almacén creado.</div>
      <button class="btn-primario" id="btn-cta-crear-almacen">${ICONOS.mas}Crear almacén</button>`;
    $("#btn-cta-crear-almacen").addEventListener("click", abrirCreadorAlmacen);
    return;
  }
  if (!state.inventarioActual){
    cont.innerHTML = `
      <div class="aviso info">Elige o crea un inventario (recuento) para ver su resumen en "${state.almacenActual}".</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${state.inventarios.length ? `<button class="btn-secundario" id="btn-cta-abrir-inventario">${ICONOS.carpeta}Abrir inventario existente</button>` : ''}
        <button class="btn-primario" id="btn-cta-crear-inventario">${ICONOS.mas}Nuevo inventario</button>
      </div>`;
    $("#btn-cta-abrir-inventario")?.addEventListener("click", abrirSelectorInventario);
    $("#btn-cta-crear-inventario").addEventListener("click", abrirCreadorInventario);
    return;
  }

  cont.innerHTML = `<div class="spinner"></div>`;
  let registros;
  try{
    registros = await cargarRegistros();
  }catch(e){
    cont.innerHTML = `<div class="aviso error">No se pudo cargar el inventario: ${e.message}</div>`;
    return;
  }

  const mapa = new Map();
  for (const r of registros){
    const cur = mapa.get(r.codigo) || { codigo:r.codigo, descripcion:r.descripcion, totalTon:0, n:0 };
    cur.totalTon += r.totalToneladas || 0;
    cur.n += 1;
    mapa.set(r.codigo, cur);
  }
  // Convertimos cada artículo a SU propia unidad base (Sacos, Unidades, Toneladas…),
  // no siempre a toneladas — se calcula a partir del maestro de artículos.
  const filas = Array.from(mapa.values()).map(f => {
    const articulo = state.articulosPorCodigo?.get(f.codigo);
    const { cantidad, nombre } = aUnidadBase(f.totalTon, articulo);
    return { ...f, cantidad, unidad: nombre };
  }).sort((a,b)=> a.codigo.localeCompare(b.codigo, "es", {numeric:true}));

  cont.innerHTML = `
    <div class="tabs-subvista">
      <button class="tab-sub ${state.vistaInventarioSub==="resumen"?"activa":""}" id="btn-sub-resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Resumen</button>
      <button class="tab-sub ${state.vistaInventarioSub==="diferencias"?"activa":""}" id="btn-sub-diferencias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M9 12h6"/></svg>Ver diferencias</button>
    </div>
    <div id="contenido-subvista"></div>
  `;
  $("#btn-sub-resumen").addEventListener("click", ()=>{ state.vistaInventarioSub = "resumen"; renderVista(); });
  $("#btn-sub-diferencias").addEventListener("click", ()=>{ state.vistaInventarioSub = "diferencias"; renderVista(); });

  if (state.vistaInventarioSub === "diferencias"){
    await renderDiferencias(registros);
    return;
  }

  const sub = $("#contenido-subvista");
  sub.innerHTML = `
    <div class="resumen-cabecera">
      <div class="chip-metrica"><div class="num">${filas.length}</div><div class="lbl">Artículos</div></div>
      <div class="chip-metrica"><div class="num">${registros.length}</div><div class="lbl">Registros</div></div>
    </div>

    <div class="campo-busqueda">
      <input id="filtro-inventario" placeholder="Filtrar por código o descripción…">
    </div>

    ${filas.length ? `
    <div class="tarjeta" style="overflow-x:auto;">
      <table class="tabla-inventario" id="tabla-inventario">
        <thead><tr><th>Código</th><th>Descripción</th><th class="num">Reg.</th><th class="num">Cantidad total</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div style="font-size:.75rem;color:var(--texto-claro);margin:-6px 0 12px;">Toca un artículo para ver o editar sus registros.</div>
    <button class="btn-secundario" id="btn-exportar">${ICONOS.descargar}Exportar a Excel</button>
    ` : `<div class="aviso info">Todavía no hay registros en este inventario.</div>`}
  `;

  function pintarTabla(filtro){
    const tbody = $("#tabla-inventario tbody");
    if (!tbody) return;
    const f = filtro ? filas.filter(x => x.codigo.toLowerCase().includes(filtro) || x.descripcion.toLowerCase().includes(filtro)) : filas;
    tbody.innerHTML = f.map(x=>`
      <tr data-codigo="${x.codigo}"><td>${x.codigo}</td><td>${x.descripcion}</td><td class="num">${x.n}</td><td class="num">${fmtCantidad(x.cantidad)} ${x.unidad}</td></tr>
    `).join("");
    tbody.querySelectorAll("tr").forEach(tr=>{
      tr.addEventListener("click", ()=>{
        const articulo = state.articulosPorCodigo?.get(tr.dataset.codigo);
        if (!articulo) return;
        state.articuloSeleccionado = articulo;
        state.editandoId = null;
        state.vista = "registrar";
        renderVista();
      });
    });
  }
  pintarTabla("");
  $("#filtro-inventario")?.addEventListener("input", e => pintarTabla(e.target.value.trim().toLowerCase()));

  $("#btn-exportar")?.addEventListener("click", () => {
    const wb = XLSX.utils.book_new();
    const infoActual = state.inventariosInfo?.[state.inventarioActual];
    const wsInfo = XLSX.utils.aoa_to_sheet([
      ["Almacén", state.almacenActual],
      ["Inventario", state.inventarioActual],
      ["Fecha y hora del recuento", infoActual?.fecha ? fmtFecha(infoActual.fecha) : ""],
      ["Creado por", infoActual?.creadoPor || ""],
      ["Exportado el", fmtFecha(new Date().toISOString())],
    ]);
    XLSX.utils.book_append_sheet(wb, wsInfo, "Info");

    const wsResumen = XLSX.utils.json_to_sheet(filas.map(f=>({
      Codigo:f.codigo, Descripcion:f.descripcion, Registros:f.n,
      Unidad:f.unidad, "Cantidad total":Number(f.cantidad.toFixed(3)),
    })));
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

    const detalle = registros.flatMap(r => r.detalle.map(d => ({
      Fecha: r.fecha, Usuario: r.usuario, Almacen: r.almacen, Inventario: r.inventario,
      Codigo: r.codigo, Descripcion: r.descripcion, Ubicacion: r.ubicacion || "", "Fecha caducidad": r.fechaCaducidad || "",
      Unidad: d.unidad, Cantidad: d.cantidad,
      "Factor Ton/ud": d.factor, "Subtotal Ton": Number(d.subtotal.toFixed(4)),
    })));
    const wsDetalle = XLSX.utils.json_to_sheet(detalle);
    XLSX.utils.book_append_sheet(wb, wsDetalle, "Detalle");

    XLSX.writeFile(wb, `Inventario_${sanitizeNombre(state.almacenActual)}_${sanitizeNombre(state.inventarioActual)}.xlsx`);
  });
}

async function renderDiferencias(registros){
  const sub = $("#contenido-subvista");
  sub.innerHTML = `<div class="spinner"></div>`;

  let stock;
  try{
    stock = await cargarStockSistema();
  }catch(e){
    console.error(e);
    sub.innerHTML = `<div class="aviso error">No se pudo comprobar el stock de sistema: ${e.message}</div>`;
    return;
  }

  const recuentoMap = agregarPorArticuloYUbicacion(registros);

  const cabeceraCarga = `
    <div class="tarjeta">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:700;font-size:.9rem;">Stock de sistema</div>
          <div style="font-size:.78rem;color:var(--texto-claro);">${stock ? `Cargado · ${stock.size} artículos` : "Todavía no se ha cargado ningún Excel para este inventario"}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <input type="file" id="input-stock-sistema" accept=".xlsx,.xls" style="display:none;">
          <button class="btn-secundario" id="btn-cargar-stock" style="width:auto;padding:9px 14px;">${stock ? ICONOS.subir+"Reemplazar Excel" : ICONOS.subir+"Cargar stock del sistema (Excel)"}</button>
        </div>
      </div>
      <div style="font-size:.72rem;color:var(--texto-claro);margin-top:8px;">Formato esperado: código artículo, descripción, cantidad 00, cantidad 10, cantidad 20 (con encabezado).</div>
    </div>`;

  $("#contenido-subvista").innerHTML = cabeceraCarga + (stock ? `<div id="tabla-diferencias-cont"></div>` : "");

  $("#btn-cargar-stock").addEventListener("click", ()=> $("#input-stock-sistema").click());
  $("#input-stock-sistema").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const btn = $("#btn-cargar-stock");
    btn.disabled = true; btn.textContent = "Cargando…";
    try{
      await subirStockSistema(file);
      await renderDiferencias(registros);
    }catch(err){
      console.error(err);
      alert("No se pudo cargar el Excel: " + err.message);
      btn.disabled = false;
    }
  });

  if (!stock) return;

  // Unión de artículos: los contados + los que trae el sistema aunque no se hayan contado
  const codigos = new Set([...recuentoMap.keys(), ...stock.keys()]);
  const filas = Array.from(codigos).map(codigo=>{
    const articulo = state.articulosPorCodigo?.get(codigo);
    const rec = recuentoMap.get(codigo) || { c00:0, c10:0, c20:0, total:0 };
    const sis = stock.get(codigo) || { c00:0, c10:0, c20:0, total:0 };
    const unidad = rec.unidad || articulo?.unidadSistema || articulo?.unidades?.[0]?.nombre || "";
    return {
      codigo,
      descripcion: articulo?.descripcion || rec.descripcion || sis.descripcion || "",
      unidad,
      rec00: rec.c00||0, rec10: rec.c10||0, rec20: rec.c20||0, recTotal: rec.total||0,
      sis00: sis.c00||0, sis10: sis.c10||0, sis20: sis.c20||0, sisTotal: sis.total||0,
      dif00: (rec.c00||0)-(sis.c00||0), dif10: (rec.c10||0)-(sis.c10||0), dif20: (rec.c20||0)-(sis.c20||0),
      difTotal: (rec.total||0)-(sis.total||0),
    };
  }).sort((a,b)=> a.codigo.localeCompare(b.codigo, "es", {numeric:true}));

  const contTabla = $("#tabla-diferencias-cont");
  contTabla.innerHTML = `
    <div class="campo-busqueda">
      <input id="filtro-diferencias" placeholder="Filtrar por código o descripción…">
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--texto-claro);margin:-4px 0 12px;">
      <input type="checkbox" id="chk-solo-diferencias"> Mostrar solo artículos con diferencia
    </label>
    <div class="tarjeta" style="overflow-x:auto;">
      <table class="tabla-inventario tabla-diferencias" id="tabla-diferencias">
        <thead>
          <tr>
            <th rowspan="2">Código</th><th rowspan="2">Descripción</th>
            <th colspan="4" class="grupo">Inventario recuento</th>
            <th colspan="4" class="grupo">Inventario sistema</th>
            <th colspan="4" class="grupo">Diferencias</th>
          </tr>
          <tr>
            <th class="num">00</th><th class="num">10</th><th class="num">20</th><th class="num">Total</th>
            <th class="num">00</th><th class="num">10</th><th class="num">20</th><th class="num">Total</th>
            <th class="num">00</th><th class="num">10</th><th class="num">20</th><th class="num">Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button class="btn-secundario" id="btn-exportar-diferencias">${ICONOS.descargar}Exportar diferencias a Excel</button>
  `;

  function celdaDif(v){
    const cls = v > 0.0005 ? "dif-sobra" : (v < -0.0005 ? "dif-falta" : "");
    return `<td class="num ${cls}">${fmtCantidad(v)}</td>`;
  }

  function pintar(filtro, soloDif){
    const tbody = $("#tabla-diferencias tbody");
    let f = filas;
    if (filtro) f = f.filter(x => x.codigo.toLowerCase().includes(filtro) || x.descripcion.toLowerCase().includes(filtro));
    if (soloDif) f = f.filter(x => Math.abs(x.difTotal) > 0.0005 || Math.abs(x.dif00)>0.0005 || Math.abs(x.dif10)>0.0005 || Math.abs(x.dif20)>0.0005);
    tbody.innerHTML = f.map(x=>`
      <tr>
        <td>${x.codigo}</td><td>${x.descripcion}</td>
        <td class="num">${fmtCantidad(x.rec00)}</td><td class="num">${fmtCantidad(x.rec10)}</td><td class="num">${fmtCantidad(x.rec20)}</td><td class="num">${fmtCantidad(x.recTotal)}</td>
        <td class="num">${fmtCantidad(x.sis00)}</td><td class="num">${fmtCantidad(x.sis10)}</td><td class="num">${fmtCantidad(x.sis20)}</td><td class="num">${fmtCantidad(x.sisTotal)}</td>
        ${celdaDif(x.dif00)}${celdaDif(x.dif10)}${celdaDif(x.dif20)}${celdaDif(x.difTotal)}
      </tr>`).join("");
  }
  pintar("", false);
  $("#filtro-diferencias").addEventListener("input", e => pintar(e.target.value.trim().toLowerCase(), $("#chk-solo-diferencias").checked));
  $("#chk-solo-diferencias").addEventListener("change", e => pintar($("#filtro-diferencias").value.trim().toLowerCase(), e.target.checked));

  $("#btn-exportar-diferencias").addEventListener("click", ()=>{
    const wb = XLSX.utils.book_new();
    const unidadCol = filas[0]?.unidad ? ` (${filas.map(f=>f.unidad).filter((v,i,a)=>a.indexOf(v)===i).join("/")})` : "";
    const ws = XLSX.utils.json_to_sheet(filas.map(x=>({
      "Código": x.codigo, "Descripción": x.descripcion, "Unidad": x.unidad,
      "Recuento 00": Number(x.rec00.toFixed(3)), "Recuento 10": Number(x.rec10.toFixed(3)), "Recuento 20": Number(x.rec20.toFixed(3)), "Recuento Total": Number(x.recTotal.toFixed(3)),
      "Sistema 00": Number(x.sis00.toFixed(3)), "Sistema 10": Number(x.sis10.toFixed(3)), "Sistema 20": Number(x.sis20.toFixed(3)), "Sistema Total": Number(x.sisTotal.toFixed(3)),
      "Diferencia 00": Number(x.dif00.toFixed(3)), "Diferencia 10": Number(x.dif10.toFixed(3)), "Diferencia 20": Number(x.dif20.toFixed(3)), "Diferencia Total": Number(x.difTotal.toFixed(3)),
    })));
    XLSX.utils.book_append_sheet(wb, ws, "Diferencias");
    XLSX.writeFile(wb, `Diferencias_${sanitizeNombre(state.almacenActual)}_${sanitizeNombre(state.inventarioActual)}.xlsx`);
  });
}

/* ============================================================
   NAVEGACIÓN / EVENTOS GENERALES
   ============================================================ */
function renderVista(){
  $("#tab-registrar").classList.toggle("activa", state.vista === "registrar");
  $("#tab-inventario").classList.toggle("activa", state.vista === "inventario");
  actualizarInfoInventarioActual();
  if (state.vista === "registrar") renderRegistrar();
  else renderInventario();
}

function actualizarInfoInventarioActual(){
  const el = $("#info-inventario-actual");
  const info = state.inventariosInfo?.[state.inventarioActual];
  if (state.inventarioActual && info?.fecha){
    el.style.display = "flex";
    el.innerHTML = `<span class="punto ok"></span> Recuento del ${fmtFecha(info.fecha)}${info.creadoPor ? " · creado por " + info.creadoPor : ""}`;
  } else {
    el.style.display = "none";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  // Registramos TODOS los listeners primero, pase lo que pase con MSAL/XLSX,
  // para que el botón de login nunca se quede "muerto" en silencio.
  $("#btn-login").addEventListener("click", login);
  $("#btn-logout").addEventListener("click", logout);
  poblarSelectMes();

  await window.__cargaLibs; // espera a que terminen los intentos de carga de librerías

  let cuentaRedirect = null;
  if (window.__msalFalló){
    avisoLogin("No se ha podido cargar la librería de inicio de sesión de Microsoft desde ninguna de las fuentes probadas (jsdelivr, unpkg, Microsoft). Es casi seguro que tu red bloquea estos dominios de CDN — pídele a tu departamento de TI que permita cdn.jsdelivr.net y unpkg.com, o prueba desde otra red (por ejemplo datos móviles) para confirmarlo.");
  } else {
    try{
      cuentaRedirect = await initMsal();
      if (cuentaRedirect){
        await arrancarApp(cuentaRedirect);
      }
    }catch(e){
      console.error(e);
      avisoLogin("Error inicializando el inicio de sesión: " + e.message);
    }
  }
  if (window.__xlsxFalló){
    avisoLogin("Aviso: no se ha podido cargar la librería de Excel (xlsx.js), la exportación a Excel no funcionará, pero el resto de la app sí debería.", "info");
  }

  document.querySelectorAll("nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.vista = btn.dataset.vista;
      state.articuloSeleccionado = null;
    state.editandoId = null;
      renderVista();
    });
  });

  $("#sel-almacen").addEventListener("change", async (e)=>{
    if (e.target.value === "__nuevo__"){
      abrirCreadorAlmacen();
      e.target.value = state.almacenActual || "";
      return;
    }
    state.almacenActual = e.target.value;
    state.articuloSeleccionado = null;
    state.editandoId = null;
    state.vistaInventarioSub = "resumen";
    await cargarInventarios();
  });

  $("#sel-inventario").addEventListener("change", (e)=>{
    if (e.target.value === "__nuevo__"){
      abrirCreadorInventario();
      e.target.value = state.inventarioActual || "";
      return;
    }
    state.inventarioActual = e.target.value;
    state.articuloSeleccionado = null;
    state.editandoId = null;
    state.vistaInventarioSub = "resumen";
    renderVista();
  });

  $("#btn-crear-almacen").addEventListener("click", async ()=>{
    const nombre = sanitizeNombre($("#input-nuevo-almacen").value);
    if (!nombre) return;
    const btn = $("#btn-crear-almacen");
    btn.disabled = true; btn.textContent = "Creando…";
    try{
      await ensureFolder(`${CONFIG.ROOT_FOLDER}/${nombre}`);
      $("#panel-nuevo-almacen").style.display = "none";
      $("#input-nuevo-almacen").value = "";
      await cargarAlmacenes();
      $("#sel-almacen").value = nombre;
      state.almacenActual = nombre;
      await cargarInventarios();
    }catch(e){
      console.error(e);
      alert("No se pudo crear el almacén: " + e.message);
    }finally{
      btn.disabled = false; btn.textContent = "Crear";
    }
  });

  $("#btn-crear-inventario").addEventListener("click", async ()=>{
    const nombre = sanitizeNombre(mesInventarioSeleccionado());
    const fechaInput = $("#input-fecha-inventario").value;
    if (!nombre) return;
    const btn = $("#btn-crear-inventario");
    btn.disabled = true; btn.textContent = "Creando…";
    try{
      const carpeta = `${CONFIG.ROOT_FOLDER}/${state.almacenActual}/${nombre}`;
      await ensureFolder(carpeta);
      await guardarInfoInventario(carpeta, {
        fecha: fechaInput ? new Date(fechaInput).toISOString() : new Date().toISOString(),
        creadoPor: state.account.name || state.account.username,
        creadoEn: new Date().toISOString(),
      });
      $("#panel-nuevo-inventario").style.display = "none";
      poblarSelectMes();
      $("#input-fecha-inventario").value = "";
      await cargarInventarios();
      $("#sel-inventario").value = nombre;
      state.inventarioActual = nombre;
      renderVista();
    }catch(e){
      console.error(e);
      alert("No se pudo crear el inventario: " + e.message);
    }finally{
      btn.disabled = false; btn.textContent = "Crear";
    }
  });

  // Intenta reanudar sesión si ya había una cuenta activa en este navegador
  // (y no acabamos de volver ya de un login por redirección, que ya se gestionó arriba)
  if (msalInstance && !cuentaRedirect){
    const cuentas = msalInstance.getAllAccounts();
    if (cuentas.length){
      msalInstance.setActiveAccount(cuentas[0]);
      arrancarApp(cuentas[0]);
    }
  }
});
</script>
